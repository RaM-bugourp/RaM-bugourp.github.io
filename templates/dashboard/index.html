<!doctype html><html lang=zh-CN><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>后台界面 · RaM原创风格样板</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f4eb;color:#173f35;font:16px/1.8 system-ui,"Microsoft YaHei",sans-serif}a{color:inherit}nav,main,footer{width:min(1080px,calc(100% - 40px));margin:auto}nav{display:flex;gap:22px;padding:24px 0;border-bottom:1px solid #bcc7bb;align-items:center;flex-wrap:wrap}nav strong{margin-right:auto}h1{font:clamp(38px,7vw,84px)/1.15 Georgia,serif;letter-spacing:-.04em;margin:30px 0}h2{font-size:30px}p{color:#5c6a62}main{min-height:75vh}.hero{padding:60px 0}.eyebrow{letter-spacing:.16em;font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{border:1px solid #bcc7bb;padding:24px;border-radius:12px;background:#fffdf7;margin-bottom:20px}button,.button{border:0;background:#173f35;color:#fff;padding:13px 20px;border-radius:30px;cursor:pointer;text-decoration:none;display:inline-block}button:focus-visible,a:focus-visible{outline:3px solid #dc6c49;outline-offset:3px}.art{height:190px;border-radius:8px;background:linear-gradient(130deg,#c5d2ad 0 40%,#173f35 40% 62%,#d97450 62%);margin-bottom:20px}.banner{background:#173f35;color:#fff;padding:35px;border-radius:18px;margin:20px 0}.banner p{color:#e0e6d8}footer{padding:30px 0;font-size:12px;border-top:1px solid #bcc7bb}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid #d2d9ce;padding:14px 8px}input{max-width:100%;font:inherit;padding:10px;border:1px solid #bcc7bb;border-radius:8px}details{padding:20px 0;border-bottom:1px solid #bcc7bb}article{max-width:740px}.bar{height:14px;background:#cfddbd;border-radius:9px;margin:15px 0}.bar span{height:100%;display:block;background:#d97450;border-radius:9px}dialog{border:1px solid #bcc7bb;border-radius:16px;max-width:90vw;padding:30px}dialog::backdrop{background:#173f3580}@media(max-width:600px){.grid{grid-template-columns:1fr}.hero{padding:35px 0}nav{gap:12px}.card{padding:20px}td,th{font-size:13px;padding:10px 4px}}body{background:#eef2f6;color:#253c54}nav{background:#253c54;color:white;padding-inline:20px}.hero{padding:25px 0}h1{font:700 42px/1.2 system-ui}.card{background:white;border-color:#d5deea;box-shadow:0 8px 25px #263f5410}.banner,button,.button{background:#3b6388}</style><nav><strong>后台界面</strong><a href=../../index.html#samples>返回模板展厅</a><a href=#main>浏览页面</a></nav><main id=main><section class=hero><div class=eyebrow>WORKSPACE / UI SAMPLE ONLY</div><h1>工作台概览</h1><p>虚构数据的管理界面样板。不连接真实后台、客户资料或业务系统。</p></section><div class=grid><div class=card><small>项目总数</small><h2>24</h2><p>虚构统计</p></div><div class=card><small>本周任务</small><h2>12</h2><p>虚构统计</p></div><div class=card><small>完成进度</small><h2>68%</h2><p>虚构统计</p></div></div><section class=card><h2>项目列表</h2><input aria-label=筛选项目 placeholder=输入项目关键词 oninput=filterRows(this.value)><table><thead><tr><th>项目</th><th>负责人</th><th>进度</th></tr></thead><tbody><tr data-row><td>阅读空间</td><td>示例成员 1</td><td>82%</td></tr><tr data-row><td>活动页面</td><td>示例成员 2</td><td>65%</td></tr><tr data-row><td>品牌手册</td><td>示例成员 3</td><td>40%</td></tr></tbody></table><p><button onclick=showInfo("这是界面演示，未连接任何真实数据或写入接口。")>新建项目示意</button></p></section></main><footer>RaM 原创无图静态风格样板 · 虚构内容，非客户案例 · <a href=../ATTRIBUTION.html>模板来源与许可说明</a></footer><dialog id=info><h2>演示说明</h2><p></p><button onclick="document.querySelector('#info').close()">关闭</button></dialog><script>function showInfo(s){document.querySelector('#info p').textContent=s;document.querySelector('#info').showModal()}function filterPosts(q){document.querySelectorAll('[data-post]').forEach(e=>e.hidden=!e.textContent.includes(q))}function filterRows(q){document.querySelectorAll('[data-row]').forEach(e=>e.hidden=!e.textContent.includes(q))}</script></html>
