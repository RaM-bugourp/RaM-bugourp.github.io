<!doctype html><html lang=zh-CN><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>企业展示站 · RaM原创风格样板</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f4eb;color:#173f35;font:16px/1.8 system-ui,"Microsoft YaHei",sans-serif}a{color:inherit}nav,main,footer{width:min(1080px,calc(100% - 40px));margin:auto}nav{display:flex;gap:22px;padding:24px 0;border-bottom:1px solid #bcc7bb;align-items:center;flex-wrap:wrap}nav strong{margin-right:auto}h1{font:clamp(38px,7vw,84px)/1.15 Georgia,serif;letter-spacing:-.04em;margin:30px 0}h2{font-size:30px}p{color:#5c6a62}main{min-height:75vh}.hero{padding:60px 0}.eyebrow{letter-spacing:.16em;font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{border:1px solid #bcc7bb;padding:24px;border-radius:12px;background:#fffdf7;margin-bottom:20px}button,.button{border:0;background:#173f35;color:#fff;padding:13px 20px;border-radius:30px;cursor:pointer;text-decoration:none;display:inline-block}button:focus-visible,a:focus-visible{outline:3px solid #dc6c49;outline-offset:3px}.art{height:190px;border-radius:8px;background:linear-gradient(130deg,#c5d2ad 0 40%,#173f35 40% 62%,#d97450 62%);margin-bottom:20px}.banner{background:#173f35;color:#fff;padding:35px;border-radius:18px;margin:20px 0}.banner p{color:#e0e6d8}footer{padding:30px 0;font-size:12px;border-top:1px solid #bcc7bb}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid #d2d9ce;padding:14px 8px}input{max-width:100%;font:inherit;padding:10px;border:1px solid #bcc7bb;border-radius:8px}details{padding:20px 0;border-bottom:1px solid #bcc7bb}article{max-width:740px}.bar{height:14px;background:#cfddbd;border-radius:9px;margin:15px 0}.bar span{height:100%;display:block;background:#d97450;border-radius:9px}dialog{border:1px solid #bcc7bb;border-radius:16px;max-width:90vw;padding:30px}dialog::backdrop{background:#173f3580}@media(max-width:600px){.grid{grid-template-columns:1fr}.hero{padding:35px 0}nav{gap:12px}.card{padding:20px}td,th{font-size:13px;padding:10px 4px}}body{background:#f5f7f7;color:#163a4d}.banner,button,.button{background:#163a4d}.card{border-radius:0;border-top:4px solid #597b8a}h1{font-family:system-ui,sans-serif;font-weight:750}</style><nav><strong>企业展示站</strong><a href=../../index.html#samples>返回模板展厅</a><a href=#main>浏览页面</a></nav><main id=main><section class=hero><div class=eyebrow>青禾设计 / FICTIONAL STUDIO</div><h1>让好想法，<br>有清晰的表达。</h1><p>从品牌梳理到网页呈现，用简洁的设计连接你的业务与客户。</p><a class=button href=#services>了解服务 ↓</a></section><section id=services><h2>我们做什么</h2><div class=grid><div class=card><h3>品牌与视觉</h3><p>从品牌关键词出发，建立一致的表达方式。</p></div><div class=card><h3>网站与内容</h3><p>把复杂信息变成容易理解的页面结构。</p></div><div class=card><h3>交付与支持</h3><p>明确范围、修改轮次与交接方式。</p></div></div></section><section class=banner><h2>从一次沟通开始</h2><p>这里可以替换为企业真实、获授权的联系方式与服务信息。</p><button onclick=showInfo("联系入口示意：正式交付时替换为客户确认的联系方式。")>沟通项目</button></section></main><footer>RaM 原创无图静态风格样板 · 虚构内容，非客户案例 · <a href=../ATTRIBUTION.html>模板来源与许可说明</a></footer><dialog id=info><h2>演示说明</h2><p></p><button onclick="document.querySelector('#info').close()">关闭</button></dialog><script>function showInfo(s){document.querySelector('#info p').textContent=s;document.querySelector('#info').showModal()}function filterPosts(q){document.querySelectorAll('[data-post]').forEach(e=>e.hidden=!e.textContent.includes(q))}function filterRows(q){document.querySelectorAll('[data-row]').forEach(e=>e.hidden=!e.textContent.includes(q))}</script></html>
