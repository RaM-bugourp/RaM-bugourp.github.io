<!doctype html><html lang=zh-CN><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>产品落地页 · RaM原创风格样板</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f4eb;color:#173f35;font:16px/1.8 system-ui,"Microsoft YaHei",sans-serif}a{color:inherit}nav,main,footer{width:min(1080px,calc(100% - 40px));margin:auto}nav{display:flex;gap:22px;padding:24px 0;border-bottom:1px solid #bcc7bb;align-items:center;flex-wrap:wrap}nav strong{margin-right:auto}h1{font:clamp(38px,7vw,84px)/1.15 Georgia,serif;letter-spacing:-.04em;margin:30px 0}h2{font-size:30px}p{color:#5c6a62}main{min-height:75vh}.hero{padding:60px 0}.eyebrow{letter-spacing:.16em;font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{border:1px solid #bcc7bb;padding:24px;border-radius:12px;background:#fffdf7;margin-bottom:20px}button,.button{border:0;background:#173f35;color:#fff;padding:13px 20px;border-radius:30px;cursor:pointer;text-decoration:none;display:inline-block}button:focus-visible,a:focus-visible{outline:3px solid #dc6c49;outline-offset:3px}.art{height:190px;border-radius:8px;background:linear-gradient(130deg,#c5d2ad 0 40%,#173f35 40% 62%,#d97450 62%);margin-bottom:20px}.banner{background:#173f35;color:#fff;padding:35px;border-radius:18px;margin:20px 0}.banner p{color:#e0e6d8}footer{padding:30px 0;font-size:12px;border-top:1px solid #bcc7bb}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid #d2d9ce;padding:14px 8px}input{max-width:100%;font:inherit;padding:10px;border:1px solid #bcc7bb;border-radius:8px}details{padding:20px 0;border-bottom:1px solid #bcc7bb}article{max-width:740px}.bar{height:14px;background:#cfddbd;border-radius:9px;margin:15px 0}.bar span{height:100%;display:block;background:#d97450;border-radius:9px}dialog{border:1px solid #bcc7bb;border-radius:16px;max-width:90vw;padding:30px}dialog::backdrop{background:#173f3580}@media(max-width:600px){.grid{grid-template-columns:1fr}.h
