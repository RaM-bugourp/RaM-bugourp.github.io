<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>眼球追随效果</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: #0a0a1a;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 60px;
    overflow: hidden;
  }

  .eye {
    width: 120px;
    height: 120px;
    background: #fff;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    box-shadow: 0 0 40px rgba(100,200,255,0.3),
                inset 0 0 30px rgba(0,0,0,0.1);
  }

  /* 虹膜 */
  .iris {
    width: 55px;
    height: 55px;
    background: radial-gradient(circle at 40% 35%, #6ab0ff, #1a3a80);
    border-radius: 50%;
    position: relative;
    transition: transform 0.05s ease-out;
    will-change: transform;
  }

  /* 瞳孔 */
  .pupil {
    width: 26px;
    height: 26px;
    background: radial-gradient(circle at 38% 32%, #555, #000);
    border-radius: 50%;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  /* 高光 */
  .iris::after {
    content: '';
    position: absolute;
    width: 14px;
    height: 14px;
    background: rgba(255,255,255,0.85);
    border-radius: 50%;
    top: 22%;
    left: 28%;
  }
</style>
</head>
<body>

<div class="eye">
  <div class="iris"><div class="pupil"></div></div>
</div>
<div class="eye">
  <div class="iris"><div class="pupil"></div></div>
</div>

<script>
const eyes    = document.querySelectorAll('.iris');
const MAX_D   = 16; // 瞳孔最大偏移像素

document.addEventListener('mousemove', e => {
  eyes.forEach(iris => {
    const rect   = iris.getBoundingClientRect();
    const cx     = rect.left + rect.width  / 2;
    const cy     = rect.top  + rect.height / 2;

    const dx   = e.clientX - cx;
    const dy   = e.clientY - cy;
    const dist = Math.hypot(dx, dy);

    if (dist === 0) return;

    // 归一化，限制最大偏移
    const nx   = (dx / dist) * Math.min(dist, MAX_D);
    const ny   = (dy / dist) * Math.min(dist, MAX_D);

    // 转换中心 → translate(-50%,-50%) + delta
    iris.style.transform =
      `translate(calc(-50% + ${nx}px), calc(-50% + ${ny}px))`;
  });
});
</script>
</body>
</html>
