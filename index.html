<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta name="description" content="RaM's Blog - 技术随笔、开发经验、Agent 工作流与个人项目记录">
    <title>RaM's Blog</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" sizes="32x32" href="images/OIP.webp">
    <link rel="icon" type="image/png" sizes="16x16" href="images/OIP.webp">
    <link rel="icon" type="image/png" sizes="512x512" href="images/OIP.webp">
</head>
<body>
<div class="container">
    <nav class="navbar">
        <div class="nav-container">
            <a class="logo" href="index.html">RaM's Blog</a>
            <button class="nav-toggle" type="button" aria-label="打开导航" aria-expanded="false"><span></span></button>
            <div class="nav-links">
                <a href="index.html">首页</a>
                <a href="archive.html">归档</a>
                <a href="friends.html">友链</a>
                <a href="about.html">关于</a>
                <a href="https://github.com/RaM-bugourp" target="_blank" rel="noopener noreferrer">GitHub</a>
            </div>
        </div>
    </nav>

    <div class="main-grid">
        <main>
            <section class="page-head">
                <span class="eyebrow">TECH / AGENT / BUILD LOG</span>
                <h1>把折腾过的东西沉淀成文章。</h1>
                <p>这里记录全栈开发、Agent 工作流、后端规范和个人项目复盘。文章列表、统计、标签和阅读时间都由构建脚本自动生成。</p>
                <div class="metric-strip" id="siteMetrics"></div>
            </section>

            <section class="toolbar" aria-label="文章筛选">
                <input type="search" data-post-search placeholder="搜索标题、摘要、标签">
                <select data-tag-select aria-label="按标签筛选"></select>
                <select data-sort-select aria-label="文章排序">
                    <option value="newest">最新优先</option>
                    <option value="oldest">最早优先</option>
                    <option value="longest">阅读最长</option>
                    <option value="shortest">阅读最短</option>
                </select>
                <button class="button" type="button" data-clear-filters>清空</button>
            </section>
            <div class="filter-status" data-filter-status></div>

            <div id="homePage" class="post-list">
                <!-- 文章列表由 js/site.js 动态渲染 -->
            </div>
        </main>

        <aside class="sidebar">
            <div class="profile-card">
                <img class="avatar-img" src="images/OIP.webp" alt="RaM头像">
                <div class="profile-name">RaM</div>
                <div class="profile-bio">全栈开发 · Agent人柱力</div>
                <div class="profile-bio">热爱代码，喜欢折腾</div>
            </div>

            <div class="stats-card">
                <div class="card-title">站点统计</div>
                <ul class="stats-list"></ul>
            </div>

            <div class="stats-card">
                <div class="card-title">热门标签</div>
                <div class="tag-cloud"></div>
            </div>

            <div class="stats-card">
                <div class="card-title">最新文章</div>
                <div class="mini-list" data-recent-posts="root"></div>
            </div>
        </aside>
    </div>

    <footer class="site-footer"></footer>
</div>

<script src="js/posts.js"></script>
<script src="js/data/friends.js"></script>
<script src="js/site.js"></script>
</body>
</html>
