<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta name="description" content="RaM's Blog - 技术随笔、开发经验、生活思考">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <title>RaM's Blog</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" sizes="32x32" href="images/OIP.webp">
    <link rel="icon" type="image/png" sizes="16x16" href="images/OIP.webp">
    <link rel="icon" type="image/png" sizes="512x512" href="images/OIP.webp">
</head>
<body>
<div class="container">
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">RaM's Blog</div>
            <div class="nav-links">
                <a href="index.html">首页</a>
                <a href="archive.html">归档</a>
                <a href="friends.html">友链</a>
                <a href="about.html">关于</a>
                <a href="https://github.com/RaM-bugourp" target="_blank">GitHub</a>
            </div>
        </div>
    </nav>

    <div class="main-grid">
        <main>
            <div id="homePage">
                <!-- 文章列表由 js/site.js 动态渲染（数据源 js/posts.js） -->
            </div>
        </main>

        <aside class="sidebar">
            <div class="profile-card">
                <img class="avatar-img" src="images/OIP.webp" alt="RaM头像">
                <div class="profile-name">RaM</div>
                <div class="profile-bio">全栈开发 · Agent人柱力</div>
                <div class="profile-bio">热爱代码，喜欢折腾</div>
            </div>

            <div class="stats-card">
                <div class="card-title">📊 站点统计</div>
                <ul class="stats-list">
                    <!-- 由 js/site.js 动态计算注入 -->
                </ul>
            </div>

            <div class="stats-card">
                <div class="card-title">🏷️ 热门标签</div>
                <div class="tag-cloud">
                    <!-- 由 js/site.js 动态生成（按使用频率） -->
                </div>
            </div>
        </aside>
    </div>

    <footer class="site-footer"></footer>
</div>

<script src="js/posts.js"></script>
<script src="js/data/friends.js"></script>
<script src="js/site.js"></script>
</body>
</html>
